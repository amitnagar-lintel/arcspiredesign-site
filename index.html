  :root{
    --ink:#0C0A07; --paper:#F2EAD9; --gold:#D4A855; --gold-deep:#8A6B33;
    --mute:#8C8172; --line:rgba(212,168,85,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(120% 90% at 50% 30%, #171208 0%, var(--ink) 55%, #070503 100%);
    color:var(--paper);
    font-family:'Josefin Sans',system-ui,sans-serif;font-weight:300;
    overflow-x:hidden;overflow-y:auto;min-height:100dvh;
    display:flex;flex-direction:column;
    cursor:default;
  }
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:2}

  .grid-bg{
    position:fixed;inset:-60px;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:72px 72px;
    mask-image:radial-gradient(ellipse 75% 65% at 50% 42%, black 25%, transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 42%, black 25%, transparent 100%);
    opacity:0;transition:opacity 2s ease;
    will-change:transform;
  }
  body.act-grid .grid-bg{opacity:1}

  /* lantern glow following cursor */
  .lantern{
    position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity 1.5s ease;
    background:radial-gradient(340px 340px at var(--lx,50%) var(--ly,40%), rgba(212,168,85,.07), transparent 70%);
  }
  body.act-grid .lantern{opacity:1}

  /* dawn glow behind the scene */
  .dawn{
    position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;
    background:radial-gradient(90% 55% at 50% 100%, rgba(212,140,60,.13), transparent 70%);
    transition:opacity 3s ease;
  }
  body.act-ambient .dawn{opacity:1;animation:dawnBreathe 14s ease-in-out 3s infinite}
  @keyframes dawnBreathe{0%,100%{opacity:1}50%{opacity:.45}}

  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px;position:relative;z-index:3;
    perspective:1000px;
  }
  .stage{will-change:transform;transform-style:preserve-3d}

  /* ground line */
  .ground{
    width:min(320px,64vw);height:1px;margin:0 auto;
    background:linear-gradient(90deg, transparent, var(--gold) 18%, var(--gold) 82%, transparent);
    transform:scaleX(0);opacity:.9;
    box-shadow:0 0 18px rgba(212,168,85,.35);
  }

  .spire-wrap{position:relative;margin-bottom:-1px}
  svg.spire{width:min(210px,34vw);display:block;margin:0 auto;overflow:visible}
  svg.spire path{fill:none;stroke:var(--gold);stroke-width:1.7;stroke-linecap:round}
  svg.spire .glowpath{stroke:rgba(212,168,85,.28);stroke-width:5;filter:blur(3px)}

  /* blueprint dimension annotations */
  svg.spire .anno{stroke:rgba(212,168,85,.34);stroke-width:.8;opacity:0;transition:opacity 1.4s ease .4s}
  svg.spire text.anno-t{
    stroke:none;fill:rgba(212,168,85,.55);font-family:'Josefin Sans',sans-serif;
    font-size:7.5px;letter-spacing:.18em;opacity:0;transition:opacity 1.4s ease .7s;
  }
  body.act-star svg.spire .anno,body.act-star svg.spire text.anno-t{opacity:1}

  /* reflection below ground line */
  .mirror{
    height:70px;overflow:hidden;pointer-events:none;
    transform:scaleY(-1);opacity:.14;
    mask-image:linear-gradient(to top, black, transparent 85%);
    -webkit-mask-image:linear-gradient(to top, black, transparent 85%);
    filter:blur(1px) saturate(.8);
  }
  .mirror svg{width:min(210px,34vw);display:block;margin:0 auto;overflow:visible}
  .mirror use{stroke:var(--gold);stroke-width:1.7;fill:none}
  .star{
    position:absolute;left:50%;top:0;width:6px;height:6px;margin:-3px;
    border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 0 rgba(212,168,85,.5);
    opacity:0;transform:scale(.2);
  }
  .star::before,.star::after{
    content:"";position:absolute;left:50%;top:50%;background:linear-gradient(to bottom, transparent, rgba(233,192,112,.9), transparent);
  }
  .star::before{width:1px;height:34px;transform:translate(-50%,-50%)}
  .star::after{width:22px;height:1px;transform:translate(-50%,-50%);
    background:linear-gradient(to right, transparent, rgba(233,192,112,.7), transparent)}
  body.act-star .star{
    opacity:1;transform:scale(1);
    transition:opacity .5s ease, transform .8s cubic-bezier(.2,1.6,.3,1);
    animation:starPulse 3.4s ease-in-out 1s infinite;
  }
  @keyframes starPulse{
    0%,100%{box-shadow:0 0 8px 2px rgba(212,168,85,.45)}
    50%{box-shadow:0 0 22px 6px rgba(212,168,85,.2)}
  }

  .kicker{
    font-size:clamp(11px,1.4vw,13px);letter-spacing:.46em;text-transform:uppercase;
    color:var(--gold);margin:34px 0 22px;
    opacity:0;transform:translateY(14px);transition:opacity .8s ease,transform .8s ease;
  }
  body.act-type .kicker{opacity:1;transform:none}

  h1{
    font-family:'Cinzel',Georgia,serif;font-weight:600;
    font-size:clamp(2.7rem,11.5vw,7.4rem);line-height:1;
    letter-spacing:.09em;text-transform:uppercase;
    display:flex;justify-content:center;
  }
  h1 .ch{
    display:inline-block;
    opacity:0;transform:translateY(.35em) rotate(4deg);filter:blur(6px);
    transition:opacity .55s ease, transform .7s cubic-bezier(.2,.9,.25,1), filter .55s ease;
    transition-delay:var(--d);
  }
  body.act-type h1 .ch{opacity:1;transform:none;filter:none}
  h1 .dot{color:var(--gold)}
  /* sheen sweep after reveal */
  body.act-ambient h1{
    background:linear-gradient(110deg, var(--paper) 42%, #FFF6E0 50%, var(--paper) 58%);
    background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:sheen 7s ease-in-out 1.2s infinite;
  }
  body.act-ambient h1 .dot{
    -webkit-text-fill-color:var(--gold);color:var(--gold)
  }
  @keyframes sheen{
    0%{background-position:120% 0}
    18%{background-position:-60% 0}
    100%{background-position:-60% 0}
  }

  .brandword{
    display:flex;align-items:center;justify-content:center;gap:18px;
    margin:20px auto 26px;
    opacity:0;transform:translateY(12px);transition:opacity .8s ease .35s,transform .8s ease .35s;
  }
  body.act-type .brandword{opacity:1;transform:none}
  .brandword::before,.brandword::after{
    content:"";width:min(72px,14vw);height:1px;background:var(--gold-deep);
  }
  .brandword span{
    font-family:'Cinzel',Georgia,serif;font-weight:500;
    font-size:clamp(13px,2.2vw,19px);letter-spacing:.68em;text-indent:.68em;
    color:var(--gold);text-transform:uppercase;
  }
  .sub{
    font-size:clamp(13px,1.9vw,17px);letter-spacing:.26em;text-transform:uppercase;color:var(--mute);
    opacity:0;transform:translateY(14px);transition:opacity .8s ease .5s,transform .8s ease .5s;
  }
  .sub b{color:var(--paper);font-weight:400}
  body.act-type .sub{opacity:1;transform:none}
  .tease{
    max-width:47ch;margin-top:24px;font-size:clamp(14.5px,2vw,16.5px);line-height:1.85;color:var(--mute);
    opacity:0;transform:translateY(14px);transition:opacity .9s ease .75s,transform .9s ease .75s;
  }
  body.act-type .tease{opacity:1;transform:none}

  footer{
    position:relative;z-index:3;
    display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;
    padding:22px 24px 32px;
    font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);
    opacity:0;transition:opacity 1.2s ease 1s;
  }
  body.act-type footer{opacity:1}
  footer .domain{color:var(--gold);font-weight:400}
  footer .sep{opacity:.4}

  .skip{
    position:fixed;right:18px;bottom:16px;z-index:4;
    font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);
    opacity:.5;transition:opacity .4s ease;
  }
  body.act-type .skip{opacity:0;pointer-events:none}

  @media (max-height:640px){.tease{display:none}svg.spire{width:130px}.kicker{margin:22px 0 16px}}
  @media (prefers-reduced-motion:reduce){
    canvas#fx{display:none}
    body .grid-bg,body .lantern,body .dawn,body .kicker,body h1 .ch,body .sub,body .tease,body footer,body .star,body .brandword,
    body svg.spire .anno,body svg.spire text.anno-t{
      opacity:1!important;transform:none!important;filter:none!important;transition:none!important;animation:none!important;
    }
    body .star::before,body .star::after{animation:none!important}
    body .ground{transform:scaleX(1)!important}
    svg.spire path{stroke-dasharray:none!important;stroke-dashoffset:0!important}
  }
</style>
</head>
<body>


<div class="grid-bg" aria-hidden="true"></div>
<div class="dawn" aria-hidden="true"></div>
<div class="lantern" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <div class="stage" id="stage">
    <div class="spire-wrap">
      <svg class="spire" viewBox="0 0 200 240" role="img" aria-label="Gold line drawing of an arched spire">
        <path class="glowpath" id="gp" d="M14 230 L30 230 L30 120 Q30 40 100 28 Q170 40 170 120 L170 230 L186 230" pathLength="1000"/>
        <path id="arch1" d="M14 230 L30 230 L30 120 Q30 40 100 28 Q170 40 170 120 L170 230 L186 230" pathLength="1000"/>
        <path id="arch2" d="M55 230 L55 128 Q55 68 100 58 Q145 68 145 128 L145 230" pathLength="1000"/>
        <path id="spike" d="M100 58 L100 10 M88 22 L100 6 L112 22" pathLength="1000"/>
        <!-- dimension annotations -->
        <g class="anno" aria-hidden="true">
          <line x1="214" y1="6" x2="214" y2="230"/>
          <line x1="208" y1="6" x2="220" y2="6"/>
          <line x1="208" y1="230" x2="220" y2="230"/>
          <line x1="-14" y1="58" x2="-14" y2="230"/>
          <line x1="-20" y1="58" x2="-8" y2="58"/>
          <line x1="-20" y1="230" x2="-8" y2="230"/>
        </g>
        <text class="anno-t" x="222" y="122" transform="rotate(90 222 122)" text-anchor="middle">ELEV. 7.2 M</text>
        <text class="anno-t" x="-22" y="146" transform="rotate(-90 -22 146)" text-anchor="middle">ARC-001</text>
        <text class="anno-t" x="100" y="252" text-anchor="middle">SCALE 1:50 · SHEET 01 · MMXXVI</text>
      </svg>
      <span class="star" aria-hidden="true"></span>
    </div>
    <div class="ground" id="ground" aria-hidden="true"></div>
    <div class="mirror" aria-hidden="true">
      <svg viewBox="0 170 200 70">
        <use href="#arch1"/><use href="#arch2"/>
      </svg>
    </div>

    <p class="kicker">A new studio is taking shape</p>
    <h1 id="word" aria-label="Arcspire."></h1>
    <div class="brandword"><span>Design</span></div>
    <p class="sub">Architecture <b>·</b> Interiors <b>·</b> Bengaluru</p>
    <p class="tease">Calm, light-filled homes and considered spaces — drawn with intent, built without chaos. The first drawings are on the board.</p>
  </div>
</main>

<footer>
  <span class="domain">arcspiredesign.com</span>
  <span class="sep">—</span>
  <span>Rising 2026</span>
</footer>

<div class="skip" aria-hidden="true">Tap to skip</div>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const body = document.body;

  /* ---- split wordmark into letters ---- */
  const word = document.getElementById('word');
  const letters = 'ARCSPIRE'.split('');
  letters.forEach((c, i) => {
    const s = document.createElement('span');
    s.className = 'ch'; s.textContent = c;
    s.style.setProperty('--d', (i * 70) + 'ms');
    word.appendChild(s);
  });
  const dot = document.createElement('span');
  dot.className = 'ch dot'; dot.textContent = '.';
  dot.style.setProperty('--d', (letters.length * 70 + 160) + 'ms');
  word.appendChild(dot);

  if (reduced) { body.classList.add('act-grid','act-star','act-type'); return; }

  /* ---- canvas: spark trail + ambient dust ---- */
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  let W, H, DPR = Math.min(devicePixelRatio || 1, 2);
  const fit = () => { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR,0,0,DPR,0,0); };
  fit(); addEventListener('resize', fit);

  const sparks = [], motes = [];
  for (let i = 0; i < 26; i++) motes.push({
    x: Math.random(), y: Math.random(), r: Math.random()*1.4 + .4,
    vx: (Math.random()-.5)*.00012, vy: -(Math.random()*.00016 + .00005),
    a: Math.random()*.35 + .08, ph: Math.random()*Math.PI*2
  });

  /* ---- SVG paths for the draw ---- */
  const paths = [
    { el: document.getElementById('arch1'), dur: 2100 },
    { el: document.getElementById('arch2'), dur: 1400 },
    { el: document.getElementById('spike'), dur: 800 },
  ];
  const gp = document.getElementById('gp');
  paths.forEach(p => { p.len = p.el.getTotalLength(); p.el.style.strokeDasharray = 1000; p.el.style.strokeDashoffset = 1000; });
  gp.style.strokeDasharray = 1000; gp.style.strokeDashoffset = 1000;
  const svg = document.querySelector('svg.spire');

  const easeInOut = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;

  /* ---- timeline ---- */
  const T_GROUND = 900;        // ground line expands
  const T_DRAW0  = 1000;       // arch1 starts
  const starts = [T_DRAW0, T_DRAW0 + 1500, T_DRAW0 + 2500];
  const T_STAR  = T_DRAW0 + 3200;
  const T_GRID  = 1600;
  const T_TYPE  = T_DRAW0 + 3600;
  const T_END   = T_TYPE + 200;

  let t0 = null, skipped = false, done = false;
  let mx = .5, my = .42, tx = .5, ty = .42;

  addEventListener('pointermove', e => { tx = e.clientX / W; ty = e.clientY / H; }, {passive:true});
  const skipNow = () => { if (!done) skipped = true; };
  addEventListener('pointerdown', skipNow, {passive:true});
  addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') skipNow(); });

  const ground = document.getElementById('ground');
  const stage = document.getElementById('stage');
  const grid = document.querySelector('.grid-bg');

  function emitSpark(x, y) {
    if (sparks.length > 140) return;
    sparks.push({
      x, y,
      vx: (Math.random()-.5)*.5, vy: Math.random()*.7 + .25,
      life: 1, decay: Math.random()*.015 + .008, r: Math.random()*1.3 + .5
    });
  }

  function frame(now) {
    if (t0 === null) t0 = now;
    let t = now - t0;
    if (skipped) { t = Math.max(t, T_END); }

    /* ground line */
    const g = Math.min(1, t / T_GROUND);
    ground.style.transform = `scaleX(${easeInOut(g)})`;

    /* grid + lantern */
    if (t > T_GRID) body.classList.add('act-grid');

    /* arch drawing + glow head + sparks */
    const box = svg.getBoundingClientRect();
    const sx = box.width / 200, sy = box.height / 240;
    let headPt = null;
    paths.forEach((p, i) => {
      const lt = (t - starts[i]) / p.dur;
      if (lt <= 0) return;
      const k = easeInOut(Math.min(1, lt));
      p.el.style.strokeDashoffset = 1000 * (1 - k);
      if (i === 0) gp.style.strokeDashoffset = 1000 * (1 - k);
      if (lt < 1) {
        const pt = p.el.getPointAtLength(p.len * k);
        headPt = { x: box.left + pt.x * sx, y: box.top + pt.y * sy };
      }
    });
    if (headPt && !skipped) {
      emitSpark(headPt.x, headPt.y); emitSpark(headPt.x, headPt.y);
    }

    if (t > T_STAR) body.classList.add('act-star');
    if (t > T_TYPE && !body.classList.contains('act-type')) {
      body.classList.add('act-type');
      setTimeout(() => body.classList.add('act-ambient'), 1400);
    }
    if (t >= T_END) done = true;

    /* canvas paint */
    ctx.clearRect(0, 0, W, H);
    ctx.shadowColor = 'rgba(233,192,112,.8)'; ctx.shadowBlur = 8;
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += .012; s.life -= s.decay;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.globalAlpha = s.life * .85;
      ctx.fillStyle = '#E9C070';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * s.life, 0, 7); ctx.fill();
    }
    ctx.shadowBlur = 0;
    if (body.classList.contains('act-grid')) {
      const tt = now * .001;
      motes.forEach(m => {
        m.x += m.vx; m.y += m.vy;
        if (m.y < -.02) { m.y = 1.02; m.x = Math.random(); }
        if (m.x < -.02) m.x = 1.02; if (m.x > 1.02) m.x = -.02;
        ctx.globalAlpha = m.a * (0.6 + 0.4 * Math.sin(tt + m.ph));
        ctx.fillStyle = '#D4A855';
        ctx.beginPath(); ctx.arc(m.x * W, m.y * H, m.r, 0, 7); ctx.fill();
      });
    }
    ctx.globalAlpha = 1;

    /* parallax (lerped) */
    mx += (tx - mx) * .06; my += (ty - my) * .06;
    const dx = (mx - .5), dy = (my - .5);
    grid.style.transform = `translate(${dx * 14}px, ${dy * 10}px)`;
    stage.style.transform = `translate3d(${dx * -8}px, ${dy * -6}px, 0) rotateY(${dx * 4}deg) rotateX(${dy * -3}deg)`;
    document.querySelector('.lantern').style.setProperty('--lx', (mx*100) + '%');
    document.querySelector('.lantern').style.setProperty('--ly', (my*100) + '%');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
